[project]
name = "crczp-python-commons"
version = "2.1.0"
description = "crczp python commons"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "cybersecurityhub.cz" }]
dependencies = [
    "crczp-topology-definition>=1.0.0",
    "netaddr>=1.3.0",
    "PyYAML>=6.0.2",
    "typing-extensions>=4.0.0",
]

# DEV ONLY — consume the in-development topology-definition from its feature branch.
# Remove before the master release (see the release runbook). uv strips this from built wheels.
[tool.uv.sources]
crczp-topology-definition = { git = "https://github.com/cyberrangecz/backend-topology-definition", branch = "feature/network-forwarding" }

[project.optional-dependencies]
dev = [
    "types-PyYAML",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
]
lint = [
    "pylint",
]

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]
exclude-packages = ["tests"]

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
strict = true
pretty = true
enable_error_code = ["deprecated", "explicit-override"]
explicit_package_bases = true

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.bandit]
skips = ["B101", "B311"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
